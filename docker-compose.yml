# Local development stack: Postgres, MinIO, API, web.
# Usage: cp .env.example .env && docker compose up --build
name: sentinel-assess

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      SENTINEL_OWNER_PASSWORD: ${SENTINEL_OWNER_PASSWORD:?set in .env}
      SENTINEL_APP_PASSWORD: ${SENTINEL_APP_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./apps/api/db/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinel"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set in .env}
    volumes: [minio-data:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://sentinel_app:${SENTINEL_APP_PASSWORD}@db:5432/sentinel
      MIGRATION_DATABASE_URL: postgres://sentinel_owner:${SENTINEL_OWNER_PASSWORD}@db:5432/sentinel
      S3_ENDPOINT: http://minio:9000
      # Signed photo URLs must use an address the browser can reach.
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_DRIVER: s3
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_started }
    ports: ["127.0.0.1:3000:3000"]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on: [api]
    ports: ["127.0.0.1:5173:5173"]

volumes:
  db-data:
  minio-data:
